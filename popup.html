
<!DOCTYPE html>
<html>
<head>
  <title>LinkNotes</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h2>LinkNotes</h2>
  <p>Capture and connect your ideas.</p>

  <button id="capture">Capture Selected Text</button>

  <input id="title" placeholder="Note title">

  <textarea id="content" placeholder="Your note..."></textarea>

  <input id="tag" placeholder="Topic (e.g. AI, Physics)">

  <button id="save">Save Note</button>

  <hr>

  <input id="search" placeholder="Search notes...">

  <h3>My Notes</h3>
  <div id="notes"></div>

  <script src="popup.js"></script>
</body>
</html>
